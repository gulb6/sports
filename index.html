function eventCard(p){
  return '<div class="ev '+(allOpen?'open':'')+'" data-ev="'+p.id+'"><div class="h" data-act="toggle-ev">'+
    '<span class="tm">'+esc(p.time)+'</span><span class="ti">'+esc(p.event)+' <span class="badge gray">'+esc(p.round)+'</span></span>'+
    '<span class="no">'+esc(p.group||'')+'</span>'+kindBadge(p.kind,isTeam(p))+
    '<span class="no">'+esc(p.note.replace(/\s+/g,' ')||'')+'</span><span class="arrow">▾</span></div>'+
    '<div class="body">'+laneTable(p)+'</div></div>';
}
function renderEvents(list,title,hint){
  var h='<div class="card sec"><h2><span class="bar"></span>'+esc(title)+'</h2><p class="hint">'+esc(hint)+'</p>'+
    '<div class="row no-print" style="margin-bottom:10px"><input class="search" id="q" placeholder="搜索项目 / 组别 / 运动员" value="'+esc(query)+'">'+
    '<button class="btn sm" data-act="expand-all">'+(allOpen?'收起全部分组表':'展开全部分组表')+'</button></div>';
  var any=false;
  D.meta.sessions.forEach(function(s){
    var l=sortEvents(list.filter(function(p){return p.session===s;}));
    if(!l.length)return; any=true;
    h+='<div class="sess">'+esc(dayLabel(s))+' <span class="badge gray">'+l.length+' 项</span></div>';
    l.forEach(function(p){h+=eventCard(p);});
  });
  if(!any)h+='<div class="empty">没有符合条件的项目</div>';
  return h+'</div>';
}

/* ---------- 裁判 / 工作组视图 ---------- */
function renderRole(id){
  var r=D.roles.filter(function(x){return x.id===id;})[0]; if(!r)return renderHome();
  var list=D.program;
  if(r.scope==='track')list=list.filter(function(p){return p.kind==='径赛';});
  if(r.scope==='field')list=list.filter(function(p){return p.kind==='田赛';});
  var h=topbar(r.name,'裁判 / 工作组视图 · 只看本岗位负责的场次');
  h+='<div class="card sec"><h2><span class="bar"></span>岗位职责</h2>'+
    '<div class="hint">'+esc(r.desc)+'</div>'+
    (r.members?'<div style="font-size:13px;color:var(--ink2)"><b>人员：</b>'+esc(r.members)+'</div>':'')+
    '<div class="stat"><div class="box"><div class="n">'+list.length+'</div><div class="l">负责项目</div></div>'+
    '<div class="box"><div class="n">'+list.reduce(function(a,p){return a+p.entries.length;},0)+'</div><div class="l">编排人次</div></div>'+
    '<div class="box"><div class="n">'+list.filter(function(p){return p.pending;}).length+'</div><div class="l">待定决赛</div></div></div>'+
    '<div class="notice"><b>到场与检录：</b>裁判员上午 8:10、下午 2:20 到达比赛地点；运动员提前 20 分钟检录，检录不到以弃权处理。</div>'+
    '<details class="no-print"><summary style="cursor:pointer;color:var(--brand);font-size:13px">展开本岗位工作须知 / 录取办法</summary>'+
    noticeList(D.notices['裁判组'])+'</details>'+
    '<div style="display:none" class="print-only">'+noticeList(D.notices['裁判组'])+'</div></div>';
  if(r.scope==='overview'){
    h+='<div class="card sec"><h2><span class="bar"></span>全场赛程概览（按时间）</h2>'+
      '<p class="hint">本岗位按时间段准备场地、器材与安全保障，无需逐项名单。</p>';
    D.meta.sessions.forEach(function(s){
      var sc=D.schedule.filter(function(x){return x.session===s;}); if(!sc.length)return;
      h+='<div class="sess">'+esc(dayLabel(s))+'</div><div class="scroll"><table><thead><tr>'+
        '<th>时间</th><th>类别</th><th>组别</th><th>项目</th><th>赛次</th><th>人数/队数</th><th>分组</th></tr></thead><tbody>'+
        sc.map(function(x){return '<tr><td class="t">'+esc(x.time)+'</td><td>'+esc(x.section)+'</td><td>'+esc(x.group)+'</td>'+
          '<td><b>'+esc(x.event)+'</b></td><td>'+esc(x.round)+'</td><td>'+esc(x.count)+'</td><td>'+esc(x.groups)+'</td></tr>';}).join('')+
        '</tbody></table></div>';
    });
    h+='</div>';
  }else{
    h+=renderEvents(list,r.scope==='all'?'全部项目编排（含分组分道表）':
      (r.scope==='track'?'径赛与团体接力编排（含分道表）':'田赛与团体项目编排（含出场顺序）'),
      '点击任一项目展开完整分组 / 分道名单；打印时会自动全部展开。');
  }
  return h;
}

/* ---------- 完整总览 ---------- */
function renderAll(){
  var h=topbar('完整秩序册 · 竞赛编排总览','组委会 / 编排组视图 · 全部 61 个项目');
  h+='<div class="card sec"><h2><span class="bar"></span>运动会信息</h2><div class="grid g3">'+
    '<div><b>时间</b><br>'+esc(D.meta.dates)+'</div><div><b>地点</b><br>'+esc(D.meta.venue)+'</div>'+
    '<div><b>规模</b><br>44 个班 · '+Object.keys(D.roster).reduce(function(a,k){return a+D.roster[k].length;},0)+' 名运动员</div></div>'+
    '<div class="tagline">原始文件：'+esc(D.meta.source)+'（39 页 PDF）。本页由其中的竞赛日程、号码对照表、个人项目编排表整理。</div></div>';
  h+=renderEvents(D.program,'全部项目编排','点击项目展开分组分道表；班主任与裁判组请使用各自的专属入口，避免信息过载。');
  return h;
}

/* ---------- 分发管理（专属链接 + 二维码） ---------- */
function qrSvg(text){
  try{ var qr=qrcode(0,'M'); qr.addData(text); qr.make();
    return qr.createSvgTag({cellSize:3,margin:2,scalable:true}); }catch(e){return '<div style="color:#c62828;font-size:11px">二维码生成失败</div>';}
}
function qrCard(name,url){
  return '<div class="qrbox"><div class="nm">'+esc(name)+'</div>'+qrSvg(url)+
    '<div class="lk">'+esc(url)+'</div><div class="ops no-print">'+
    '<button class="btn sm" data-act="copy" data-v="'+esc(url)+'">复制链接</button>'+
    '<a class="btn sm" href="'+esc(url)+'" target="_blank">打开</a></div></div>';
}
function renderAdmin(){
  if(!adminBase)adminBase=BASE;
  var isLocal=/^file:/i.test(adminBase);
  var h=topbar('组委会分发管理','每个班 / 每个裁判组一个专属链接与二维码');
  h+='<div class="card sec no-print"><h2><span class="bar"></span>第 1 步：填写发布后的网址</h2>'+
    '<p class="hint">把本页面（单个 HTML 文件）发给信息老师上传校园网 / 发布为在线链接，然后把完整网址粘贴到下面，二维码会自动更新。'+
    '二维码内容为纯英文参数，微信/相机扫码可直接打开对应专属页。</p>'+
    '<div class="row" style="justify-content:flex-start"><input class="search" id="base" style="max-width:620px" value="'+esc(adminBase)+'" placeholder="https://…/index.html">'+
    '<button class="btn primary" data-act="refresh-qr">刷新二维码</button>'+
    '<button class="btn" data-act="copy-all">复制全部链接</button>'+
    '<button class="btn" data-act="print">打印二维码表</button></div>'+
    (isLocal?'<div class="notice amber"><b>当前是本地文件地址</b>，二维码只能在本机打开，别人扫码无效。发布为在线网址后请重新粘贴上方地址再打印。</div>':'')+
    '<div class="tagline">分发方式：① 打印下方二维码表，裁开贴到各班 / 各裁判组；② 直接把对应链接发到班级群、教师群；'+
    '③ 打开链接后点"打印 / 存 PDF"生成 A4 分册。</div></div>';
  h+='<div class="card sec"><h2><span class="bar"></span>班主任专属入口（44 个班）</h2>'+
    '<p class="hint">打开后只显示本班赛程、运动员名单、检录时间与必读须知。</p>'+
    '<div class="grid g4">'+D.meta.classes.map(function(c){return qrCard(c,adminBase+'?c='+clsSlug(c));}).join('')+'</div></div>';
  h+='<div class="card sec"><h2><span class="bar"></span>裁判 / 工作组专属入口（8 组）</h2>'+
    '<p class="hint">打开后只显示本岗位负责的场次与完整分组分道表。</p>'+
    '<div class="grid g4">'+D.roles.map(function(r){return qrCard(r.name,adminBase+'?r='+ROLE_SLUG[r.id]);}).join('')+'</div></div>';
  return h;
}

/* ---------- 渲染与事件 ---------- */
function render(){
  var h = S.mode==='class'?renderClass(S.id):S.mode==='role'?renderRole(S.id):
          S.mode==='all'?renderAll():S.mode==='admin'?renderAdmin():renderHome();
  document.getElementById('app').innerHTML=h;
  document.title=(S.mode==='class'?S.id+' · ':S.mode==='role'?S.id+' · ':'')+'第四十届运动会 · 分角色查询';
  applyQuery();
  window.scrollTo(0,0);
}
function applyQuery(){
  if(!query)return;
  var q=query.toLowerCase();
  document.querySelectorAll('[data-row]').forEach(function(tr){tr.classList.toggle('hidden',tr.getAttribute('data-row').indexOf(q)<0);});
  document.querySelectorAll('.ev').forEach(function(ev){
    var t=ev.textContent.toLowerCase(); ev.classList.toggle('hidden',t.indexOf(q)<0);
  });
}
function copyText(t,ok){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){if(ok)ok();});}
  else{var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');if(ok)ok();}catch(e){} document.body.removeChild(ta);}
}
function toast(msg){
  var el=document.createElement('div');el.textContent=msg;
  el.style.cssText='position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1b2434;color:#fff;padding:9px 18px;border-radius:9px;font-size:13px;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.2)';
  document.body.appendChild(el);setTimeout(function(){el.remove();},1600);
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]'); if(!b)return;
  var a=b.getAttribute('data-act'),v=b.getAttribute('data-v');
  if(a==='print'){ window.print(); }
  else if(a==='tab'){ tab=v; render(); }
  else if(a==='toggle-ev'){ b.parentNode.classList.toggle('open'); }
  else if(a==='expand-all'){ allOpen=!allOpen; render(); }
  else if(a==='copy'){ copyText(v,function(){toast('链接已复制');}); }
  else if(a==='copy-link'){ copyText(location.href,function(){toast('本页专属链接已复制');}); }
  else if(a==='copy-all'){
    var lines=['【班主任专属链接】'].concat(D.meta.classes.map(function(c){return c+'\t'+adminBase+'?c='+clsSlug(c);}),
      ['','【裁判组专属链接】'],D.roles.map(function(r){return r.name+'\t'+adminBase+'?r='+ROLE_SLUG[r.id];}));
    copyText(lines.join('\n'),function(){toast('全部 '+(D.meta.classes.length+D.roles.length)+' 个链接已复制');});
  }
  else if(a==='refresh-qr'){
    var v2=document.getElementById('base').value.trim(); if(!v2)return; adminBase=v2; render();
  }
});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){ query=e.target.value.trim(); applyQuery(); }
  if(e.target.id==='base'){ /* 回车刷新 */ }
});
document.addEventListener('keydown',function(e){
  if(e.target.id==='base'&&e.key==='Enter'){adminBase=e.target.value.trim();render();}
});
render();
})();
</script>
